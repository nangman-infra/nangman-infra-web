services:
  frontend:
    image: harbor.nangman.cloud/library/nangman-infra-frontend:latest
    container_name: nangman-infra-frontend
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "7777:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      BACKEND_URL: http://backend:3333
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - nangman-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/ko',r=>{r.resume();process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  backend:
    image: harbor.nangman.cloud/library/nangman-infra-backend:latest
    container_name: nangman-infra-backend
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    expose:
      - "3333"
    environment:
      NODE_ENV: production
      PORT: "3333"
      FRONTEND_URL: ${FRONTEND_URL}
      MATTERMOST_WEBHOOK_URL: ${MATTERMOST_WEBHOOK_URL}
      DIRECTUS_URL: ${DIRECTUS_URL}
      DIRECTUS_TOKEN: ${DIRECTUS_TOKEN}
      KUMA_URL: ${KUMA_URL}
      KUMA_STATUS_PAGE_SLUG: ${KUMA_STATUS_PAGE_SLUG}
      NUT_SERVER_URL: ${NUT_SERVER_URL}
      NUT_UPS_NAME: ${NUT_UPS_NAME}
      NUT_USERNAME: ${NUT_USERNAME}
      NUT_PASSWORD: ${NUT_PASSWORD}
      SECURITY_OPNSENSE_URL: ${SECURITY_OPNSENSE_URL:-}
      SECURITY_OPNSENSE_CREDENTIALS_FILE: /run/secrets/nangman-security/api-key.txt
      SECURITY_OPNSENSE_CA_FILE: /run/secrets/nangman-security/appliance.pem
      SECURITY_OPNSENSE_CERT_SHA256: ${SECURITY_OPNSENSE_CERT_SHA256:-}
      SECURITY_WAN_INTERFACES: ${SECURITY_WAN_INTERFACES:-}
      SECURITY_PROTECTED_ADDRESSES: ${SECURITY_PROTECTED_ADDRESSES:-}
      SECURITY_SOURCE_UTC_OFFSET: ${SECURITY_SOURCE_UTC_OFFSET:-+09:00}
      SECURITY_GEOIP_FILE: /run/secrets/nangman-security/dbip-country-lite.csv.gz
    volumes:
      - /proc:/host/proc:ro
      - type: bind
        source: ${SECURITY_FILES_DIR:-/opt/nangman-infra/security}
        target: /run/secrets/nangman-security
        read_only: true
    restart: unless-stopped
    networks:
      - nangman-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3333/api/v1/contact/health',r=>{r.resume();process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - --http-api-update
      - --cleanup
      - --label-enable
      - --interval=0
      - --api-version=1.44
    environment:
      WATCHTOWER_HTTP_API_TOKEN: ${WATCHTOWER_TOKEN}
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - nangman-network
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

networks:
  nangman-network:
    driver: bridge
